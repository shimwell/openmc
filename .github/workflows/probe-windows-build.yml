# Scratch job to establish a Windows feedback loop. It is not a wheel build and
# is not required to pass: the job sets continue-on-error so it can never block
# a merge. It exists to answer the open questions in the Windows support issue.
#
#   1. Does the vanilla (no DAGMC) source compile with MSVC, and which OpenMP
#      setting is needed? Partly answered. The serial leg compiles the whole
#      library and links openmc.exe, so OpenMP was never the blocker it was
#      assumed to be. /openmp:llvm handles collapse and atomic capture but
#      still rejects four constructs in src/, so that leg stays experimental
#      until they are dealt with separately.
#   2. Does WINDOWS_EXPORT_ALL_SYMBOLS export the globals that openmc.lib reads
#      through ctypes in_dll? Answered: no. It emits functions and mutable data
#      but not read-only data, so the const flags were silently absent. They
#      now carry OPENMC_API from include/openmc/export.h.
#
# Delete this workflow once Windows wheels are building for real.

name: Probe Windows Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-windows-build.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'pyproject.toml'
      - 'openmc/**'

jobs:
  probe:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          # Still exploratory. /openmp:llvm gets much further than plain
          # /openmp, but four constructs in src/ remain unacceptable to it:
          # 'seq_cst' on atomic in shared_array.h, a non-conforming collapse
          # bound in plot.cpp, and a reduction on a non-static member in
          # flat_source_domain.cpp and random_ray_simulation.cpp. Marked
          # experimental so this known failure does not show up as a red check
          # while that is worked on separately.
          - name: openmp-llvm
            openmp: 'ON'
            extra_args: '-DOpenMP_RUNTIME_MSVC=llvm'
            experimental: true
          # Expected to pass. This is the configuration a first vanilla wheel
          # would ship, so a failure here is a real regression.
          - name: openmp-off
            openmp: 'OFF'
            extra_args: ''
            experimental: false

    name: probe (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for versioning from git tags
          submodules: recursive  # vendored pugixml and fmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HDF5 via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install hdf5[core,hl]:x64-windows
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # extra_args comes first so that an empty value cannot leave a dangling
      # backtick line continuation, which PowerShell rejects.
      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build ${{ matrix.extra_args }} `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DOPENMC_USE_OPENMP=${{ matrix.openmp }} `
            -DOPENMC_USE_DAGMC=OFF `
            -DOPENMC_USE_LIBMESH=OFF `
            -DOPENMC_USE_MPI=OFF `
            -DOPENMC_USE_UWUW=OFF `
            -DOPENMC_BUILD_TESTS=OFF

      # Job-level continue-on-error keeps the workflow run green, but the job
      # itself is still reported as failed to the checks API, which puts a red
      # check on the PR. Tolerating the failure at step level instead lets the
      # experimental leg report its findings in the log without doing that.
      - name: Build
        shell: pwsh
        continue-on-error: ${{ matrix.experimental }}
        run: cmake --build build --config Release -j 4

      - name: Show build outputs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build -Include libopenmc.dll,libopenmc.lib,openmc.exe |
            Select-Object FullName,Length

      # The real test of WINDOWS_EXPORT_ALL_SYMBOLS. Function exports are the
      # easy part; data exports are where the export table falls short.
      #
      # This checks every global that openmc.lib reads through ctypes in_dll,
      # both the direct in_dll calls and the ones behind the _DLLGlobal
      # descriptor in openmc/lib/core.py. That is 24 symbols, not the five
      # originally assumed. Only presence is tested, since in_dll resolves a
      # symbol regardless of the ctypes type used to view it.
      #
      # run_mode and rel_max_lost_particles were absent until they were given
      # C linkage: they are declared in namespace openmc::settings, so without
      # extern "C" they are name-mangled while openmc/lib looks them up
      # unmangled. That was a pre-existing bug on every platform rather than a
      # Windows export problem, so it is fixed separately, but both are
      # required here now.
      #
      # Uses bash because PowerShell has no heredoc.
      - name: Check ctypes data-symbol exports
        if: always()
        shell: bash
        run: |
          DLL=$(find build -name libopenmc.dll | head -1)
          if [ -z "$DLL" ]; then
            echo "libopenmc.dll not produced, nothing to check"
            exit 0
          fi
          export OPENMC_DLL="$DLL"
          python - <<'PY'
          import ctypes, os, sys
          vcpkg = os.environ.get("VCPKG_ROOT", "")
          hdf5_bin = os.path.join(vcpkg, "installed", "x64-windows", "bin")
          if os.path.isdir(hdf5_bin):
              os.add_dll_directory(hdf5_bin)
          path = os.path.abspath(os.environ["OPENMC_DLL"])
          dll = ctypes.CDLL(path)
          print("loaded:", path)

          EXPECTED = [
              # const bool flags, the four that WINDOWS_EXPORT_ALL_SYMBOLS drops
              "DAGMC_ENABLED", "UWUW_ENABLED", "LIBMESH_ENABLED",
              "STRICT_FP_ENABLED",
              # direct in_dll calls in openmc/lib
              "current_batch", "n_coord_levels", "n_realizations",
              "openmc_err_msg", "path_statepoint_c",
              # behind _DLLGlobal in openmc/lib/core.py
              "cmfd_run", "entropy_on", "event_based", "gen_per_batch",
              "max_lost_particles", "n_inactive", "n_particles",
              "need_depletion_rx", "output_summary", "restart_run", "run_CE",
              "verbosity", "weight_windows_on",
              # given C linkage so openmc/lib can find them at all
              "run_mode", "rel_max_lost_particles",
          ]

          def present(name):
              try:
                  ctypes.c_char.in_dll(dll, name)
                  return True
              except Exception:
                  return False

          missing = []
          for name in EXPECTED:
              if present(name):
                  print(f"  OK      {name}")
              else:
                  missing.append(name)
                  print(f"  MISSING {name}")

          print(f"\n{len(missing)} of {len(EXPECTED)} required data symbols missing")
          if missing:
              print("Missing: " + ", ".join(missing))
              print("These need OPENMC_API in their declaration, see include/openmc/export.h")
              sys.exit(1)
          print("All required data symbols are exported.")
          PY

  # The probe job above builds with CMake directly, which never touches pip or
  # scikit-build-core. This job covers the packaging path instead, because two
  # things have never been exercised on Windows at all:
  #
  #   * scikit-build-core, which pip drives via pyproject.toml
  #   * the "bin" entry in the core library search in openmc/__init__.py, added
  #     because Windows installs a DLL as a RUNTIME artifact to bindir rather
  #     than as a LIBRARY artifact to libdir
  #
  # Every check below is tolerant and runs with if: always(), so one run reports
  # all of the failures rather than stopping at the first. The whole job is
  # exploratory, so it never turns a PR red.
  #
  # Two known limitations, both expected to fail here rather than being bugs:
  #
  #   * a plain "pip install ." does not bundle the HDF5 DLLs, which is what
  #     delvewheel does for a real wheel, so the import is tried both with and
  #     without the vcpkg bin directory made visible
  #   * cmake/GenerateScript.cmake writes a POSIX-only console script, so
  #     "openmc --version" is expected to fail until that is fixed
  pip-install:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 120
    name: probe (pip install)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for versioning from git tags
          submodules: recursive  # vendored pugixml and fmt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install HDF5 via vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install hdf5[core,hl]:x64-windows
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      # Forward slashes in the toolchain path because SKBUILD_CMAKE_ARGS is a
      # semicolon-separated list and backslashes invite quoting trouble.
      - name: pip install
        id: install
        continue-on-error: true
        shell: pwsh
        run: |
          $toolchain = "$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake".Replace('\', '/')
          $env:SKBUILD_CMAKE_ARGS = @(
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain",
            "-DVCPKG_TARGET_TRIPLET=x64-windows",
            "-DOPENMC_USE_DAGMC=OFF",
            "-DOPENMC_USE_LIBMESH=OFF",
            "-DOPENMC_USE_MPI=OFF",
            "-DOPENMC_USE_UWUW=OFF",
            "-DOPENMC_USE_OPENMP=OFF",
            "-DOPENMC_BUILD_TESTS=OFF"
          ) -join ';'
          python -m pip install --upgrade pip
          python -m pip install . -v

      # Where did the DLL and the console script actually land?
      - name: Show installed layout
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $site = python -c "import sysconfig; print(sysconfig.get_path('platlib'))"
          Write-Host "platlib: $site"
          Get-ChildItem -Recurse "$site/openmc" -Include libopenmc.dll,*.lib |
            Select-Object FullName,Length
          $scripts = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          Write-Host "scripts: $scripts"
          Get-ChildItem "$scripts" -Filter 'openmc*' | Select-Object Name,Length

      # Does openmc/__init__.py find the DLL in bin? This imports the pure
      # Python package only, so it does not need the HDF5 DLLs yet.
      - name: import openmc
        if: always()
        continue-on-error: true
        shell: pwsh
        run: python -c "import openmc; print('openmc', openmc.__version__); print('lib:', openmc.lib_path if hasattr(openmc, 'lib_path') else 'n/a')"

      # Expected to fail: nothing has bundled the HDF5 DLLs at this point.
      - name: import openmc.lib without HDF5 on the DLL path
        if: always()
        continue-on-error: true
        shell: pwsh
        run: python -c "import openmc.lib; print('imported openmc.lib')"

      # The same import with the vcpkg bin directory made visible. If this
      # passes while the one above fails, the only remaining gap is bundling,
      # which is delvewheel's job.
      - name: import openmc.lib with HDF5 on the DLL path
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import os
          hdf5_bin = os.path.join(os.environ["VCPKG_ROOT"], "installed", "x64-windows", "bin")
          print("adding", hdf5_bin, "isdir:", os.path.isdir(hdf5_bin))
          if os.path.isdir(hdf5_bin):
              os.add_dll_directory(hdf5_bin)
          import openmc.lib
          print("imported openmc.lib")
          print("DAGMC_ENABLED:", openmc.lib.DAGMC_ENABLED)
          print("run_mode:", openmc.lib.settings.run_mode)
          print("rel_max_lost_particles:", openmc.lib.settings.rel_max_lost_particles)
          PY

      # Expected to fail until cmake/GenerateScript.cmake is fixed: the script
      # it installs has a shebang, no .exe suffix and dispatches with os.execv.
      - name: openmc --version
        if: always()
        continue-on-error: true
        shell: pwsh
        run: openmc --version
